<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lab GPU Dashboard</title>
  <link rel="stylesheet" href="scheduler.css">
</head>
<body>
  <div id="loginBox">
    <h1>Lab GPU Dashboard</h1>
    <p>Enter shared password</p>
    <input type="password" id="pw" placeholder="Password">
    <button onclick="checkPassword()">Enter</button>
    <div id="error"></div>
  </div>

  <div id="app">
    <h1>Lab GPU Dashboard</h1>
    <div id="updated"></div>

    <div id="dashboardView">
      <div class="request-panels">
        <div class="request-panel">
          <button class="primary request-action" id="sendSupportBtn">Ping for Support</button>
          <div class="field">
            <label for="supportUser">User</label>
            <select id="supportUser"></select>
          </div>
          <div class="field">
            <label for="supportServer">Server</label>
            <select id="supportServer"></select>
          </div>
          <div class="field">
            <label for="supportIssue">Issue</label>
            <select id="supportIssue">
              <option value="Server unavailable">Server unavailable</option>
              <option value="No storage">No storage</option>
            </select>
          </div>
          <div id="supportMessage"></div>
        </div>

        <div class="request-panel">
          <button class="primary request-action" id="sendFreeUpBtn">Ping to Free Up</button>
          <div class="field">
            <label for="freeUpUser">User</label>
            <select id="freeUpUser"></select>
          </div>
          <div class="field">
            <label for="freeUpServer">Server</label>
            <select id="freeUpServer"></select>
          </div>
          <div class="field">
            <label for="freeUpGpuCount">No. of GPUs</label>
            <select id="freeUpGpuCount"></select>
          </div>
          <div id="freeUpMessage"></div>
        </div>
      </div>

      <div id="summary" class="summary"></div>
      <div id="content"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="scheduler-config.js"></script>
  <script src="scheduler.js"></script>
</body>
</html>
